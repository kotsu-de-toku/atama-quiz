# 毎晩23:20ごろ（日本時間）に、インスタの数字（インサイト）を取ってきて暗号化して保存する
# 読むだけ（投稿はしない）。手動で「Run workflow」からも動かせる
name: 毎晩の数字あつめ

on:
  # 2026-11-11 停止：インスタ側で「API access blocked.」（アプリごと止められている。10/16 の作業用Facebookアカウント停止の影響）。
  # 新しく使えるアプリと合鍵ができたら、下の2行の「#」を外す
  # schedule:
  #   - cron: "20 14 * * *"   # 14:20 UTC ＝ 23:20 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 数字を取ってくる
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: python3 scripts/insights.py
      - name: 結果を保存する
        if: always()
        run: |
          git config user.name "kotsu-de-toku-bot"
          git config user.email "kotsu-de-toku@users.noreply.github.com"
          git add -A secret
          if ! git diff --cached --quiet; then
            git commit -m "数字の記録 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase
            git push
          fi
